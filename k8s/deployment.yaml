---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-django-deployment
  labels:
    app: my-django-app
  namespace: my-django-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-django-app
  template:
    metadata:
      labels:
        app: my-django-app
    spec:
      containers:
        - name: my-django-container
          image: tpchungg/my_django_app:d9d726ed96ffc1619ad8ff875d348234d2fdce46
          imagePullPolicy: Always
          ports:
          - containerPort: 7070

---
apiVersion: v1
kind: Service
metadata:
  name: my-django-service
  namespace: my-django-namespace
  labels:
    app: my-django-service
spec:
  type: ClusterIP
  selector:
    app: my-django-app
  ports:
    - name: metrics
      protocol: TCP
      port: 80
      targetPort: 7070