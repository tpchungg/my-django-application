---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-django-deployment
  labels:
    app: my-django-app
  namepsace: my-django-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-django-app
  template:
    metadata:
      labels:
        app: my-django-app
    spec:
      containers:
        - name: my-django-container
          image: tpchungg/my_django_app:153ee83f5128e06cc39cb1e3044b4337bfb425cd
          imagePullPolicy: Always
          ports:
          - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: my-django-service
  namespace: my-django-namespace
spec:
  type: ClusterIP
  selector:
    app: my-django-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080